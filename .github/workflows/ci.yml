name: Sample Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build and Basic Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Display success message
        run: echo "Basic CI checks completed successfully!"

  semgrep-sast:
    name: Semgrep SAST Security Gate
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep security scan
        run: semgrep scan --config auto .

  trivy-sca:
    name: Trivy SCA Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan dependencies for High and Critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

  zap-dast:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flask dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Start Flask application
        run: |
          python app.py > /tmp/flask.log 2>&1 &

      - name: Wait for application to start
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:5000/health; then
              echo "Application is ready!"
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to start"
          cat /tmp/flask.log
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:5000"
          fail_action: true
          allow_issue_writing: false
          fail_action_on_error: true
          cmd_options: "-I"

  gitleaks-secrets:
    name: Gitleaks Secrets Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-image-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Verify Trivy installation
        run: trivy --version
      - name: Build Docker image
        run: |
          docker build -t payment-demo:${{ github.sha }} .
      - name: Generate SBOM using Trivy
        run: |
          trivy image \
            --format cyclonedx \
            --output sbom.cdx.json \
            payment-demo:${{ github.sha }}
      - name: Scan SBOM using Trivy
        run: |
          trivy sbom sbom.cdx.json \
            --severity HIGH,CRITICAL \
            --exit-code 1
      - name: Scan Docker image using Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: payment-demo:${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

  security-gate:
    name: Final Security Gate
    runs-on: ubuntu-latest
    needs:
      - semgrep-sast
      - trivy-sca
      - zap-dast
      - gitleaks-secrets
      - docker-image-scan
    if: ${{ always() }}

    steps:
      - name: Verify all security checks
        env:
          SEMGREP_RESULT: ${{ needs.semgrep-sast.result }}
          TRIVY_SCA_RESULT: ${{ needs.trivy-sca.result }}
          ZAP_RESULT: ${{ needs.zap-dast.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks-secrets.result }}
          DOCKER_RESULT: ${{ needs.docker-image-scan.result }}
        run: |
          echo "Semgrep SAST: $SEMGREP_RESULT"
          echo "Trivy SCA: $TRIVY_SCA_RESULT"
          echo "OWASP ZAP DAST: $ZAP_RESULT"
          echo "Gitleaks: $GITLEAKS_RESULT"
          echo "Docker Image Scan: $DOCKER_RESULT"

          if [[ "$SEMGREP_RESULT" != "success" ||
                "$TRIVY_SCA_RESULT" != "success" ||
                "$ZAP_RESULT" != "success" ||
                "$GITLEAKS_RESULT" != "success" ||
                "$DOCKER_RESULT" != "success" ]]; then
            echo "::error::Security gate failed. One or more security checks did not pass."
            exit 1
          fi

          echo "All security checks passed!"
